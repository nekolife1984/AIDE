name: AIDE CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  unit_tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    if: github.repository == 'nekolife1984/AIDE'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run aide-init unit tests
        run: python -m unittest discover -s .agents/skills/aide-init/tests -v
      - name: Install Markdown parser
        run: python -m pip install --requirement requirements-ci.txt
      - name: Run Markdown checker unit tests
        run: python -m unittest discover -s scripts/tests -v

  markdown_links:
    name: Markdown links
    if: github.repository == 'nekolife1984/AIDE'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Markdown parser
        run: python -m pip install --requirement requirements-ci.txt
      - name: Validate local Markdown links
        run: python scripts/check_markdown_links.py

  required_check:
    name: Required checks
    if: always() && github.repository == 'nekolife1984/AIDE'
    needs:
      - unit_tests
      - markdown_links
    runs-on: ubuntu-latest
    env:
      UNIT_TESTS_RESULT: ${{ needs.unit_tests.result }}
      MARKDOWN_LINKS_RESULT: ${{ needs.markdown_links.result }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Require all validations to pass
        run: bash .github/scripts/require_ci_checks.sh
